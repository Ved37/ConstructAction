version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHUNKS_PKL_PATH=${CHUNKS_PKL_PATH:-/data/chunks.pkl}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_ALG=${JWT_ALG:-HS256}
      - JWT_EXP_MIN=${JWT_EXP_MIN:-60}
    volumes:
      - ./.data:/data
    restart: unless-stopped
# Note: Database is external; compose does not start a DB instance.
